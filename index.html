  <script>
    // Suppress third-party Netlify badge / HUD iframe injection
    (function() {
      function removeBadge() {
        var el = document.getElementById("nl-badge-frame") || document.getElementById("nl-hud-frame") || document.querySelector('iframe[title*="Netlify"]');
        if (el) el.remove();
        var s = document.querySelector('script[data-nf-variant]');
        if (s) s.remove();
      }
      removeBadge();
      var obs = new MutationObserver(removeBadge);
      obs.observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener("DOMContentLoaded", removeBadge);
      window.addEventListener("load", removeBadge);
    })();
  </script>
